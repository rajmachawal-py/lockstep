name: Deploy & Keepalive

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  deploy-status:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://candid-cupcake-5f4141.netlify.app/
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Warm Backend API
        run: |
          curl -s https://lockstep-d6b5.onrender.com/health || true

      - name: Register Production Deployment
        run: |
          echo "Lockstep Operations Platform Production Deployment"
          echo "Live Web Application: https://candid-cupcake-5f4141.netlify.app/"
          echo "Live Backend API: https://lockstep-d6b5.onrender.com/"
